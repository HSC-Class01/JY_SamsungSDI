name: Update OpenDART data and deploy dashboard

on:
  schedule:
    # 매월 1일 09:00 KST
    - cron: "0 0 1 * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: samsung-sdi-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update OpenDART data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          test -n "$DART_API_KEY" || (
            echo "ERROR: DART_API_KEY secret is empty."
            exit 1
          )

          python scripts/fetch_opendart.py --start-year 2010
          python scripts/analyze.py

      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data reports

          if git diff --cached --quiet; then
            echo "No new OpenDART data to commit."
          else
            git commit -m "data: update Samsung SDI OpenDART data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
